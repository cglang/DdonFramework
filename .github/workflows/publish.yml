name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify tag matches version.props
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -oP '(?<=<Version>).*?(?=</Version>)' version.props)

          echo "Tag Version : $TAG_VERSION"
          echo "File Version: $FILE_VERSION"

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag 与 version.props 不一致"
            exit 1
          fi

      - name: Publish NuGet Packages
        env:
          nupkg_api_key: ${{ secrets.NUGET_API_KEY }}
        run: |
          chmod +x scripts/publish.sh
          ./scripts/publish.sh