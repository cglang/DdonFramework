name: Publish NuGet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -oP '(?<=<Version>).*?(?=</Version>)' version.props)

          echo "Tag Version : $TAG_VERSION"
          echo "File Version: $FILE_VERSION"

          if [ -z "$FILE_VERSION" ]; then
            echo "Cannot read version.props"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag version does not match version.props"
            exit 1
          fi

      - name: Pack NuGet Packages
        shell: bash
        run: |
          mkdir -p artifacts

          while read -r project
          do
            [[ -z "$project" ]] && continue
            [[ "$project" =~ ^# ]] && continue

            PROJECT_FILE="src/$project/$project.csproj"

            if [ ! -f "$PROJECT_FILE" ]; then
              echo "Project not found: $PROJECT_FILE"
              exit 1
            fi

            echo "Packing $project"

            dotnet pack "$PROJECT_FILE" \
              -c Release \
              -p:ContinuousIntegrationBuild=true \
              --no-logo \
              -o artifacts

          done < publish-projects.txt

      - name: Publish NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob

          for package in artifacts/*.nupkg
          do
            [[ "$package" == *.snupkg ]] && continue

            echo "Publishing $(basename "$package")"

            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done